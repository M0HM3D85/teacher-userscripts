name: Fix GreasyFork require URLs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-greasyfork-requires.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unapproved raw GitHub @require URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js'): (
                  'https://raw.githubusercontent.com/M0HM3D85/teacher-userscripts/dc36723dbe9b1b46fd78aec254d628465fbf41c4/scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js',
                  'https://cdn.jsdelivr.net/gh/M0HM3D85/teacher-userscripts@dc36723dbe9b1b46fd78aec254d628465fbf41c4/scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js'
              ),
              Path('scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js'): (
                  'https://raw.githubusercontent.com/M0HM3D85/teacher-userscripts/7cd9b5a395ae64b5317160d8dca05dfe56f9eecf/scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js',
                  'https://cdn.jsdelivr.net/gh/M0HM3D85/teacher-userscripts@7cd9b5a395ae64b5317160d8dca05dfe56f9eecf/scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js'
              ),
          }

          changed = []
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
              elif new not in text:
                  raise SystemExit(f'Expected @require URL not found in {path}')

          print('Changed:', ', '.join(changed) if changed else 'already fixed')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js
          git commit -m "Fix GreasyFork approved @require URLs"
          git push
