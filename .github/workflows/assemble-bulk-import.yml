name: Assemble verified bulk import

on:
  push:
    branches:
      - dev
    paths:
      - 'imports-bulk/**/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Assemble bulk import
        run: node tools/assemble-bulk-import.mjs

      - name: Validate userscripts
        run: node tools/validate-userscripts.mjs

      - name: Syntax check
        run: |
          find scripts -name '*.user.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Commit imported sources
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: adopt official userscript source files"
          git push origin HEAD:dev
