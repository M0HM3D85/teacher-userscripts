name: Patch Student Rasid V2 state machine

on:
  push:
    branches:
      - feat/student-rased-noor-v2
    paths:
      - '.github/scripts/patch_student_rased_v2_state_machine.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/student-rased-noor-v2
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_student_rased_v2_state_machine.py

      - name: Commit patch
        run: |
          if git diff --quiet -- scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md
          git commit -m "fix(student-rased): align Noor V2 state machine with real postbacks"
          git push origin HEAD:feat/student-rased-noor-v2
