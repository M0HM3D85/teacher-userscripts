name: Temporary Smart Enhancer v1.3.9 sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Smart Enhancer v1.3.9 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-smart-enhancer-v139/part-*.patch > /tmp/smart-enhancer-v139.patch
          git apply --check /tmp/smart-enhancer-v139.patch
          git apply /tmp/smart-enhancer-v139.patch
          python .tmp-smart-enhancer-v139/sync_docs.py

      - name: Verify source and catalog
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js
          node tools/validate-userscripts.mjs

      - name: Commit synchronized v1.3.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js \
            scripts/microsoft-forms-smart-enhancer/README.md \
            scripts/microsoft-forms-smart-enhancer/CHANGELOG.md \
            scripts/catalog.json
          git rm -r .tmp-smart-enhancer-v139
          git rm .github/workflows/smart-enhancer-v139-sync.yml
          git commit -m "feat: update Smart Enhancer to v1.3.9"
          git push origin HEAD:main
