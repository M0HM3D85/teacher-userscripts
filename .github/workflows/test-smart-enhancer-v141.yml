name: Test Smart Enhancer v1.4.1

on:
  push:
    branches:
      - test/smart-enhancer-v1.4.1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check Smart Enhancer
        run: node --check scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js

      - name: Verify v1.4.1 reset recovery markers
        shell: bash
        run: |
          set -euo pipefail
          file="scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js"
          grep -Fq "// @version      1.4.1" "$file"
          grep -Fq "function migrateUnreviewedDecreasesV141()" "$file"
          grep -Fq "unreviewed-reset-v141" "$file"
          grep -Fq "unreviewed-reset-migrated-v141" "$file"
          grep -Fq "explicit-reviewed-adjusted-down-v141" "$file"
          grep -Fq "version: 3" "$file"
          cmp -s "$file" scripts/microsoft-forms-smart-enhancer/forms-smart-enhancer-v1.4.1.txt
