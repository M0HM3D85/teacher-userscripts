name: Update Rasid Catalog 2.1

on:
  push:
    branches:
      - feat/student-rased-follow-studio-v2-1
    paths:
      - '.github/scripts/update_rased_catalog_2_1.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-rased-follow-studio-v2-1
          fetch-depth: 0

      - name: Update catalog
        run: python .github/scripts/update_rased_catalog_2_1.py

      - name: Validate catalog and userscripts
        run: node tools/validate-userscripts.mjs

      - name: Syntax check Rasid
        run: node --check scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(student-rased): sync catalog for v2.1.0"
          git push origin HEAD:feat/student-rased-follow-studio-v2-1
