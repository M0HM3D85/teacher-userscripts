name: Build Madrasati Schedule Userscript

on:
  push:
    paths:
      - 'scripts/madrasati-schedule-designer/.build-source/READY'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble userscript
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/madrasati-schedule-designer
          test -f .build-source/part-001.txt
          cat .build-source/part-*.txt > madrasati-schedule-designer.user.js
          python - <<'PY'
          from pathlib import Path
          path = Path('madrasati-schedule-designer.user.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              ": subjectAccentMap.get(\ncanonical(\nsubject\n)\n}\n\"",
              ": subjectAccentMap.get(\ncanonical(\nsubject\n)\n)\n}\n\"",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          node --check madrasati-schedule-designer.user.js
          rm -rf .build-source

      - name: Commit generated userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/madrasati-schedule-designer/madrasati-schedule-designer.user.js
          git add -A scripts/madrasati-schedule-designer/.build-source
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(schedule-designer): sync userscript 2.0.0 with extension 0.2.0'
          git push
