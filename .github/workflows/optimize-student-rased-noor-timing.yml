name: Optimize Student Rasid Noor timing

on:
  push:
    branches:
      - feat/student-rased-noor-v2
    paths:
      - '.github/scripts/optimize_student_rased_noor_timing.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/student-rased-noor-v2
          fetch-depth: 0

      - name: Apply optimization
        run: python .github/scripts/optimize_student_rased_noor_timing.py

      - name: Commit optimization
        run: |
          if git diff --quiet -- scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md
          git commit -m "perf(student-rased): speed up Noor extraction state machine"
          git push origin HEAD:feat/student-rased-noor-v2
