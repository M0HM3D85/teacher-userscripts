name: Temporary MAI 1.4.6 Release Assembler

on:
  push:
    branches:
      - release-mai-1.4.6
    paths:
      - '.github/workflows/temp-release-mai-146.yml'

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-mai-1.4.6
          fetch-depth: 0

      - name: Assemble exact v1.4.6 script
        shell: bash
        run: |
          set -euo pipefail
          test -d .release-tmp/mai146
          {
            cat .release-tmp/mai146/part01
            cat .release-tmp/mai146/part02
            cat .release-tmp/mai146/part03
            cat .release-tmp/mai146/part04
            cat .release-tmp/mai146/part05
            cat .release-tmp/mai146/part06
            cat .release-tmp/mai146/part07
            cat .release-tmp/mai146/part08
            cat .release-tmp/mai146/part09
            cat .release-tmp/mai146/part10
            cat .release-tmp/mai146/part11
            cat .release-tmp/mai146/part11x
            cat .release-tmp/mai146/part12
            cat .release-tmp/mai146/part13
            cat .release-tmp/mai146/part14
            cat .release-tmp/mai146/part15
          } > scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js

          actual="$(git hash-object scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js)"
          expected="bf6690dede0e1fa517cd1e28337678516845ce31"
          echo "Final script blob: $actual"
          test "$actual" = "$expected"

      - name: Syntax check
        run: node --check scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js

      - name: Repository validation
        run: node tools/validate-userscripts.mjs

      - name: Commit clean release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-tmp/mai146
          rm -f .github/workflows/temp-release-mai-146.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: release Madrasati Assignment Intelligence v1.4.6"
          git push origin HEAD:release-mai-1.4.6
