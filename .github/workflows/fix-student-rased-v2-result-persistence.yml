name: Fix Student Rasid V2 result persistence

on:
  push:
    branches:
      - feat/student-rased-noor-v2
    paths:
      - '.github/scripts/fix_student_rased_v2_result_persistence.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/student-rased-noor-v2
          fetch-depth: 0

      - name: Apply fix
        run: python .github/scripts/fix_student_rased_v2_result_persistence.py

      - name: Commit fix
        run: |
          if git diff --quiet -- scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/CHANGELOG.md
          git commit -m "fix(student-rased): persist Noor V2 school results"
          git push origin HEAD:feat/student-rased-noor-v2
