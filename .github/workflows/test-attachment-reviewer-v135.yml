name: Test Attachment Reviewer v1.3.5

on:
  push:
    branches:
      - test/microsoft-forms-attachment-reviewer-v1.3.5

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check scripts/microsoft-forms-attachment-reviewer/microsoft-forms-attachment-reviewer.user.js

      - name: Verify v1.3.5 markers
        shell: bash
        run: |
          set -euo pipefail
          file="scripts/microsoft-forms-attachment-reviewer/microsoft-forms-attachment-reviewer.user.js"
          grep -Fq "// @version      1.3.5" "$file"
          grep -Fq "function deleteCurrentResponse()" "$file"
          grep -Fq "REFERENCE_VISIBLE_STORAGE_KEY" "$file"
          grep -Fq "id=\"m0ar-delete-response\"" "$file"
          grep -Fq "0 = صفر" "$file"
          grep -Fq "F = كاملة" "$file"
          grep -Fq "setFullQuickScore" "$file"
          grep -Fq "responseDeleteCandidates" "$file"
          test "$(grep -o 'id=\"m0ar-zero-score\"' "$file" | wc -l)" -eq 1
          test "$(grep -o 'id=\"m0ar-full-score\"' "$file" | wc -l)" -eq 1
          test "$(grep -o 'id=\"m0ar-delete-response\"' "$file" | wc -l)" -eq 1
          cmp -s "$file" scripts/microsoft-forms-attachment-reviewer/forms-attachment-reviewer-v1.3.5.txt

      - name: Package test files
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-forms-attachment-reviewer-v1.3.5
          path: |
            scripts/microsoft-forms-attachment-reviewer/microsoft-forms-attachment-reviewer.user.js
            scripts/microsoft-forms-attachment-reviewer/forms-attachment-reviewer-v1.3.5.txt
          if-no-files-found: error
