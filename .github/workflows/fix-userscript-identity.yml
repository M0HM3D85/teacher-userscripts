name: Fix userscript identity metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-userscript-identity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch identity metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          forms = Path('scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js')
          text = forms.read_text(encoding='utf-8')
          marker = ' Forms Smart Results Analyzer + ZipGrade — v0.4.0\n'
          identity = (
              '\n تصميم وتطوير: Mohammed Almalki (M0HM3D85)\n'
              ' X / Twitter : https://x.com/M0HM3D85\n'
              ' Snapchat    : https://www.snapchat.com/add/M0HM3D85\n'
              ' GreasyFork  : https://greasyfork.org/en/users/1636459-m0hm3d85\n'
              ' © 2026 Mohammed Almalki (M0HM3D85) — جميع الحقوق محفوظة.\n'
          )
          if 'https://x.com/M0HM3D85' not in text:
              if marker not in text:
                  raise SystemExit('Forms identity marker not found')
              text = text.replace(marker, marker + identity, 1)
              forms.write_text(text, encoding='utf-8')

          zipf = Path('scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js')
          text = zipf.read_text(encoding='utf-8')
          old_home = '// @homepageURL  https://github.com/M0HM3D85/teacher-userscripts/tree/main/scripts/zipgrade-smart-student-manager'
          new_home = '// @homepageURL  https://greasyfork.org/en/users/1636459-m0hm3d85'
          if old_home in text:
              text = text.replace(old_home, new_home, 1)
          elif new_home not in text:
              raise SystemExit('ZipGrade homepage marker not found')

          marker = ' ZipGrade Smart Student Manager v0.8.1 — Final Release\n'
          identity = (
              '\n تصميم وتطوير: Mohammed Almalki (M0HM3D85)\n'
              ' X / Twitter : https://x.com/M0HM3D85\n'
              ' Snapchat    : https://www.snapchat.com/add/M0HM3D85\n'
              ' GreasyFork  : https://greasyfork.org/en/users/1636459-m0hm3d85\n'
          )
          if 'https://x.com/M0HM3D85' not in text:
              if marker not in text:
                  raise SystemExit('ZipGrade identity marker not found')
              text = text.replace(marker, marker + identity, 1)
          zipf.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/forms-smart-results-analyzer/forms-smart-results-analyzer.user.js scripts/zipgrade-smart-student-manager/zipgrade-smart-student-manager.user.js
          git commit -m "Fix userscript identity metadata"
          git push
