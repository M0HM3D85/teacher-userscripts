name: Add Follow Compact Flow

on:
  push:
    branches:
      - feat/student-rased-follow-studio-v2-1
    paths:
      - '.github/scripts/add_follow_compact_flow.py'
      - '.github/workflows/add-follow-compact-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-rased-follow-studio-v2-1
          fetch-depth: 0

      - name: Apply compact flow option
        run: python .github/scripts/add_follow_compact_flow.py

      - name: Validate userscript syntax
        run: node --check scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Validate repository metadata
        run: node tools/validate-userscripts.mjs

      - name: Validate compact flow markers
        run: |
          grep -q "followCompactFlow" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "function followCompactSections" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "إكمال الطلاب بقوائم جانبية" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/README.md scripts/student-rased-madrasati-noor/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(student-rased): add compact follow page flow"
          git push origin HEAD:feat/student-rased-follow-studio-v2-1
