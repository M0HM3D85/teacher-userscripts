name: Student Rasid Noor V2 upgrade

on:
  push:
    branches:
      - feat/student-rased-noor-v2
    paths:
      - .github/workflows/student-rased-noor-v2-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/student-rased-noor-v2
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/upgrade_student_rased_noor_v2.py

      - name: Syntax check
        run: node --check scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Verify V2 markers
        run: |
          grep -F "StudntNamesReportV2.aspx*" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -F "const VERSION = '2.0.0';" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js \
                  scripts/student-rased-madrasati-noor/README.md \
                  scripts/student-rased-madrasati-noor/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(student-rased): support Noor V2"
          git push origin HEAD:feat/student-rased-noor-v2
