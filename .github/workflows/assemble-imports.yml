name: Assemble verified imports

on:
  push:
    branches:
      - dev
    paths:
      - 'imports/**/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Assemble and verify
        run: node tools/assemble-imports.mjs

      - name: Validate userscripts
        run: node tools/validate-userscripts.mjs

      - name: Commit generated scripts
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: assemble verified userscript sources"
          git push origin HEAD:dev
