name: Validate Userscripts

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate userscript metadata and identity
        run: node tools/validate-userscripts.mjs

      - name: Syntax check all userscripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find scripts -name '*.user.js' -print0)

      - name: Functional smoke tests for the unified Madrasati userscript
        run: node tools/test-madrasati-unified.mjs

      - name: Assignment import apply-button regression test
        run: node tools/test-madrasati-assignment-apply.mjs

      - name: Project grade confirmation overlay regression test
        run: node tools/test-madrasati-project-confirm.mjs

      - name: Independent projects pagination and roster-completeness tests
        run: node tools/test-madrasati-projects-pagination.mjs
