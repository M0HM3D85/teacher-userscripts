name: Temp Release MAI 1.4.2

on:
  push:
    branches: [release-mai-1.4.2]
    paths:
      - '.github/workflows/temp-release-mai-142.yml'

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-mai-1.4.2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble v1.4.2 and update release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, shutil

          root = Path('.')
          script_path = root / 'scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js'
          readme_path = root / 'scripts/madrasati-assignment-intelligence/README.md'
          changelog_path = root / 'scripts/madrasati-assignment-intelligence/CHANGELOG.md'
          catalog_path = root / 'scripts/catalog.json'

          parts = [root / f'.release-tmp/mai142.part{i}' for i in range(1, 7)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit(f'Missing payload parts: {missing}')

          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          source = gzip.decompress(base64.b64decode(payload))
          text = source.decode('utf-8')
          if '// @version      1.4.2' not in text or "const VERSION = '1.4.2'" not in text:
              raise SystemExit('Payload is not the expected v1.4.2 userscript')
          script_path.write_text(text, encoding='utf-8')

          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          entry = next(x for x in catalog['scripts'] if x.get('id') == 'madrasati-assignment-intelligence')
          entry['version'] = '1.4.2'
          entry['status'] = 'stable'
          entry['description'] = 'مدير واجبات مدرستي مع لوحة شاملة لجميع صفحات الواجبات والمنشورات، تقارير أداء نهائية للواجبات المنتهية فقط وفق وقت خادم مدرستي، تحليل طلاب وأسئلة، PDF/Excel/CSV، واستيراد درجات ذكي.'
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = '''# Madrasati Assignment Intelligence | مدير الواجبات الذكي

> مدير ذكي لواجبات مدرستي يجمع إدارة الواجبات، رصد الطلاب، التحليل، التقارير، واستيراد الدرجات في سير عمل واحد، مع منع التقارير النهائية الناقصة قبل انتهاء وقت استقبال الواجب.

**الإصدار الحالي:** `1.4.2`

## ما الذي يقدمه السكربت؟

يضيف السكربت أدوات متقدمة لصفحات واجبات المعلم في مدرستي. يمكنه قراءة سجل الواجبات، اكتشاف مرات النشر الحالية والمنتهية، تحليل بيانات الرصد، ومراجعة أداء الطلاب والأسئلة، مع إبقاء الواجب الجاري خارج التقرير النهائي حتى ينتهي وقت النشر فعليًا.

## أبرز المزايا

- لوحة شاملة في صفحة إدارة الواجبات مع جمع الواجبات من جميع صفحات `Index` تلقائيًا وإزالة التكرار حسب `Assignment GUID`.
- فحص جميع مرات نشر الواجب، الحالية والمنتهية، مع دعم تعدد صفحات `PublishedAssignments`.
- تحليل أداء الواجبات المنتهية فقط؛ الواجب الذي ما زال يستقبل الحلول يظهر بحالة **قيد الاستقبال** ولا يدخل في المتوسطات أو التقارير النهائية.
- تحديد حالة الواجب مباشرة من صفحة `GradeAssignment` باستخدام `ServerDateTime` و`PublishedEndTime` من خادم مدرستي بدل الاعتماد على ساعة الجهاز أو `published=false`.
- عدم عرض أصفار وهمية عند غياب البيانات؛ تظهر حالة غير متاحة أو غير مكتشفة بدل تحويل المفقود إلى صفر.
- تحليل الطلاب: نسبة الحل، المتوسط، أعلى وأدنى أداء، غير المحلين، وتصنيف الأداء بالنسب المئوية لا بالدرجة الخام.
- دعم حالات الدرجات الصغيرة والكشف عن تعارض بيانات مدرستي مع اعتماد نتيجة الطالب عند توفرها كمصدر أقوى للتحليل.
- تحليل أعمق للأسئلة عند توفر بيانات كافية، مع نسب الإجابة الصحيحة والخاطئة وأصعب وأسهل الأسئلة.
- طباعة نموذج الأسئلة بنسختين: نسخة معلم بالإجابات الصحيحة ونسخة طالب بدون الإجابات.
- تصدير تقارير إلى PDF وExcel وCSV.
- استيراد درجات XLSX/CSV مع مطابقة دقيقة للطلاب، ملاحظات تلقائية، ومراجعة آمنة قبل التطبيق والحفظ.
- دعم طي لوحات السكربت وحفظ حالة العرض.

## منطق التقرير النهائي

في صفحة `GradeAssignment` يقرأ السكربت القيمتين:

- `ServerDateTime`: وقت خادم مدرستي.
- `PublishedEndTime`: وقت نهاية استقبال الواجب.

إذا كان وقت الخادم أسبق من نهاية النشر، يعد الواجب **قيد الاستقبال** ولا يصدر له تقرير أداء نهائي. عند وصول وقت الخادم إلى وقت النهاية أو تجاوزه يصبح الواجب مؤهلًا للتحليل النهائي.

## طريقة الاستخدام

1. ثبّت السكربت عبر Tampermonkey.
2. افتح صفحة **إدارة الواجبات** في مدرستي لرؤية اللوحة الشاملة.
3. استخدم **فحص المنشورات** لاكتشاف مرات النشر وروابط الرصد.
4. استخدم **تحليل أداء الواجبات المنتهية** لبناء التقرير النهائي من الواجبات التي انتهى وقتها فقط.
5. داخل صفحة رصد واجب واحد، استخدم أدوات التحليل أو الاستيراد أو الطباعة حسب الحاجة.
6. راجع البيانات قبل أي حفظ أو تطبيق درجات داخل مدرستي.

## المواقع المدعومة

- `https://schools.madrasati.sa/Teacher/Assignments/*`
- `https://schools.madrasati.sa/SchoolManagment/Actions/MyStudents*`

