الترخيص: **All Rights Reserved**
'''
          readme_path.write_text(readme, encoding='utf-8')

          old = changelog_path.read_text(encoding='utf-8')
          if '## [1.4.2]' not in old:
              heading = '# Changelog\n\nجميع التغييرات المهمة في **Madrasati Assignment Intelligence | مدير الواجبات الذكي** تُسجل هنا.\n\n'
              release = '''## [1.4.2] — 2026-09-19

- اعتماد الإصدار النهائي بعد اختبارات فعلية على صفحات إدارة الواجبات والرصد والنتائج.
- إضافة لوحة شاملة لصفحة إدارة الواجبات مع جمع جميع صفحات `Index` تلقائيًا وإزالة التكرار حسب `Assignment GUID`.
- فحص المنشورات الحالية والمنتهية لكل واجب، مع دعم تعدد صفحات المنشورات وروابط الرصد المتعددة.
- منع الأصفار الوهمية عند غياب البيانات، وإظهار حالات واضحة مثل غير مكتشف أو غير متاح بدل الصفر غير المؤكد.
- استبعاد الواجبات قيد الاستقبال من تقارير الأداء النهائية والمتوسطات والإحصاءات المجمعة.
- اعتماد `ServerDateTime` و`PublishedEndTime` من صفحة `GradeAssignment` لتحديد انتهاء الواجب مباشرة من وقت خادم مدرستي.
- عدم استخدام `published=false` كمؤشر على انتهاء الواجب.
- إضافة تحليل أداء الواجبات المنتهية: نسب الحل، المتوسطات، غير المحلين، وعدد سجلات الطلاب عبر جميع مرات النشر.
- تحسين معالجة الواجبات الآلية ذات الدرجات الصغيرة والكشف عن تعارض درجة الرصد مع نتيجة الطالب.
- اعتماد نتيجة الطالب كأقوى مصدر عند وجود تعارض موثق، وعدم اعتبار `AutoGrade` درجة محققة.
- تحسين تحليل الأسئلة وقراءة الإجابات الصحيحة والخاطئة عند توفر أدلة كافية من صفحة النتيجة.
- إصلاح استخراج اسم الواجب من العنوان الموثوق داخل `homeworks-management-section` ومنع تسرب عناوين النوافذ المنبثقة إلى التقارير والطباعة.
- دمج طباعة الأسئلة والنموذج في واجهة واحدة مع نسخة معلم بالإجابات ونسخة طالب بدونها.
- إضافة/تحسين PDF وExcel وCSV وحالة طي اللوحات مع الحفاظ على أدوات الاستيراد والمطابقة والحفظ الآمن من النواة المستقرة.

'''
              if old.startswith(heading):
                  old = heading + release + old[len(heading):]
              else:
                  old = heading + release + old
              changelog_path.write_text(old, encoding='utf-8')

          shutil.rmtree(root / '.release-tmp')
          workflow = root / '.github/workflows/temp-release-mai-142.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          node tools/validate-userscripts.mjs

      - name: Commit assembled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release Madrasati Assignment Intelligence v1.4.2'
          git push origin HEAD:release-mai-1.4.2
