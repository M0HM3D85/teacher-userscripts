name: Temp Release MAI 1.4.2

on:
  push:
    branches:
      - release-mai-1.4.2
    paths:
      - .github/workflows/temp-release-mai-142.yml

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-mai-1.4.2
          fetch-depth: 0

      - name: Assemble v1.4.2 userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .release-tmp/mai142.part1 .release-tmp/mai142.part2 .release-tmp/mai142.part3 .release-tmp/mai142.part4 .release-tmp/mai142.part5 .release-tmp/mai142.part6 | tr -d '\n\r ' | base64 -d | gzip -d > scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          grep -F '// @version      1.4.2' scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          grep -F "const VERSION = '1.4.2'" scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          node --check scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js

      - name: Commit assembled script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          git rm -r .release-tmp
          git commit -m 'feat: assemble Madrasati Assignment Intelligence v1.4.2'
          git push origin HEAD:release-mai-1.4.2

# trigger after all six deterministic payload parts restored
