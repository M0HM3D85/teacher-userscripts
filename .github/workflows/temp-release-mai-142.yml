name: Temp Release MAI 1.4.2

on:
  push:
    branches:
      - release-mai-1.4.2
    paths:
      - .github/workflows/temp-release-mai-142.yml

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-mai-1.4.2
          fetch-depth: 0

      - name: Verify payload and assemble userscript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = {
              1: (9000, '32880d9ba5b7367020a6dfbc93fa7345e0176d2757b7d39425ed77b30efc603e'),
              2: (9000, '2fbec8dcfe3b68f6124dfa6ea0b3631eb6967a9bf93c3664f35ea985a6eb05cb'),
              3: (9000, '586e48a3173439dc8055a3607d0f2ed1d1b9129d10cd0b4d9130440dbacd8343'),
              4: (9000, '639578b869cc5c2bdd4c3b2111988bb706e61dca20f729838798341780f83a2d'),
              5: (9000, 'a485eaaa2282f32232b8e2b8d6b37658adba8d99047f7e9d0ff9aad6ee8215ae'),
              6: (7496, '70818e458fbffaa4cecfa1c81af0e78b872f571a8cd1d1f4757311d266e9b7fe'),
          }
          pieces = []
          report = []
          ok = True
          for i in range(1, 7):
              p = Path(f'.release-tmp/mai142.part{i}')
              raw = p.read_text(encoding='utf-8').strip()
              h = hashlib.sha256(raw.encode()).hexdigest()
              report.append(f'part{i}: len={len(raw)} sha256={h}')
              exp_len, exp_hash = expected[i]
              if len(raw) != exp_len or h != exp_hash:
                  ok = False
                  report.append(f'  EXPECTED len={exp_len} sha256={exp_hash}')
              pieces.append(raw)
          if ok:
              payload = ''.join(pieces)
              packed = base64.b64decode(payload, validate=True)
              source = gzip.decompress(packed)
              source_hash = hashlib.sha256(source).hexdigest()
              report.append(f'source: len={len(source)} sha256={source_hash}')
              if len(source) != 158687 or source_hash != 'e2ab91f86b397c029a0a6e8734b3830611cd86e51092b641bac6da325c30ab27':
                  ok = False
                  report.append('  EXPECTED len=158687 sha256=e2ab91f86b397c029a0a6e8734b3830611cd86e51092b641bac6da325c30ab27')
              else:
                  Path('scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js').write_bytes(source)
          Path('.release-tmp/diagnostic.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          if not ok:
              raise SystemExit('payload verification failed')
          PY
          grep -F '// @version      1.4.2' scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          grep -F "const VERSION = '1.4.2'" scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          node --check scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js

      - name: Commit diagnostic if verification failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .release-tmp/diagnostic.txt ]; then
            git add .release-tmp/diagnostic.txt
            git commit -m 'chore: record MAI payload diagnostic' || true
            git push origin HEAD:release-mai-1.4.2 || true
          fi

      - name: Commit assembled script
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/madrasati-assignment-intelligence/madrasati-assignment-intelligence.user.js
          git rm -r .release-tmp
          git commit -m 'feat: assemble Madrasati Assignment Intelligence v1.4.2'
          git push origin HEAD:release-mai-1.4.2
