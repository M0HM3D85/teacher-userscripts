name: Import official userscript sources

on:
  push:
    branches: [dev]
    paths:
      - 'imports-official/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import and verify official sources
        run: node tools/import-official-sources.mjs

      - name: Validate metadata, rights and versions
        run: node tools/validate-userscripts.mjs

      - name: JavaScript syntax check
        run: |
          find scripts -name '*.user.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: adopt 13 verified official userscripts"
          git push origin HEAD:dev
