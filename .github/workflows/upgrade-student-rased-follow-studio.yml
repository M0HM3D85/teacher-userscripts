name: Upgrade Student Rasid Follow Studio

on:
  push:
    branches:
      - feat/student-rased-follow-studio-v2-1
    paths:
      - '.github/scripts/upgrade_student_rased_follow_studio.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-rased-follow-studio-v2-1
          fetch-depth: 0

      - name: Apply follow studio upgrade
        run: python .github/scripts/upgrade_student_rased_follow_studio.py

      - name: Validate userscript syntax
        run: node --check scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Validate follow studio markers
        run: |
          grep -q "@version      2.1.0" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "استوديو كشوف المتابعة" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "function followGroups" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "function exportFollow" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/README.md scripts/student-rased-madrasati-noor/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(student-rased): upgrade follow sheets studio"
          git push origin HEAD:feat/student-rased-follow-studio-v2-1
