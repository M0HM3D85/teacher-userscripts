name: Temporary Smart Enhancer Sync

on:
  push:
    paths:
      - .github/workflows/tmp-smart-enhancer-v136-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write Smart Enhancer v1.3.6
        shell: bash
        run: |
          sha256sum .github/tmp-smart-enhancer-v136/chunk-*.txt
          wc -c .github/tmp-smart-enhancer-v136/chunk-*.txt
          cat .github/tmp-smart-enhancer-v136/chunk-*.txt > /tmp/smart-enhancer-v136.b64
          sha256sum /tmp/smart-enhancer-v136.b64
          test "$(sha256sum /tmp/smart-enhancer-v136.b64 | cut -d' ' -f1)" = "becff4d39485c1d57f01eaccd30b590247f8cca86b475b0dfb86b22b65ffaa04"
          python -c "import pathlib,base64,bz2; pathlib.Path('scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js').write_bytes(bz2.decompress(base64.b64decode(pathlib.Path('/tmp/smart-enhancer-v136.b64').read_text())))"
          node --check scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js
          grep -Fq '// @version      1.3.6' scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js
          git config user.name 'M0HM3D85'
          git config user.email '66501068+M0HM3D85@users.noreply.github.com'
          git add scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(forms-smart-enhancer): release v1.3.6'
          git push origin HEAD:main
