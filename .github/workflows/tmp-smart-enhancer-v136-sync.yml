name: Temporary Smart Enhancer Catalog Sync

on:
  push:
    paths:
      - .github/workflows/tmp-smart-enhancer-v136-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Smart Enhancer catalog entry to v1.3.6
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/catalog.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data['scripts']:
              if item.get('id') == 'microsoft-forms-smart-enhancer':
                  item['version'] = '1.3.6'
                  item['description'] = 'محسن شامل لـ Microsoft Forms: فهرسة وبحث ومتابعة الاستجابات الجديدة وقوالب إعدادات وتدقيق، مع إدارة جماعية سريعة للأسئلة عبر Forms API وتوافق محسّن مع صفحة المراجعة.'
                  break
          else:
              raise SystemExit('Smart Enhancer catalog entry not found')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          grep -Fq '"version": "1.3.6"' scripts/catalog.json
          node --check scripts/microsoft-forms-smart-enhancer/microsoft-forms-smart-enhancer.user.js
          git config user.name 'M0HM3D85'
          git config user.email '66501068+M0HM3D85@users.noreply.github.com'
          git add scripts/catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(catalog): sync Smart Enhancer v1.3.6'
          git push origin HEAD:main
