name: Refine Student Rasid Follow Studio

on:
  push:
    branches:
      - feat/student-rased-follow-studio-v2-1
    paths:
      - '.github/scripts/refine_student_rased_follow_studio.py'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-rased-follow-studio-v2-1
          fetch-depth: 0

      - name: Apply follow studio refinements
        run: python .github/scripts/refine_student_rased_follow_studio.py

      - name: Validate userscript syntax
        run: node --check scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Validate refinement markers
        run: |
          grep -q "function followClassGroups" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "encodeURIComponent(JSON.stringify" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js
          grep -q "group-row" scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js

      - name: Commit refined product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/student-rased-madrasati-noor/student-rased-madrasati-noor.user.js scripts/student-rased-madrasati-noor/README.md scripts/student-rased-madrasati-noor/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "refactor(student-rased): refine follow studio grouping and presets"
          git push origin HEAD:feat/student-rased-follow-studio-v2-1
